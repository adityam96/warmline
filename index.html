<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warmline</title>
<meta name="description" content="Warmline is a design mock of a networking inbox for MBA students: suggested replies, follow-up reminders, a calendar and a daily plan. All people, companies and data are fictional.">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: one-screen networking inbox. Tabs + conversation list | thread with suggested replies | contact panel. LinkedIn palette, light only */
  color-scheme:light;
  --bg:#F4F2EE;--card:#FFFFFF;--soft:#F8F7F4;--fg:#191919;--ink:#262626;--muted:#5E5E5E;--subtle:#767676;
  --line:#E8E6E1;--line-soft:#F1EFEB;--line-strong:#D1CEC8;--hover:rgba(25,25,25,.04);--search:#EEF3F8;--track:#EFEDE8;
  --sel:#EEF4FB;--focus:rgba(10,102,194,.18);
  --r-lg:12px;--r-md:8px;--r-sm:6px;
  --shadow-card:0 1px 2px rgba(25,25,25,.04),0 0 0 1px var(--line);
  --shadow-pop:0 12px 32px rgba(25,25,25,.14),0 2px 6px rgba(25,25,25,.06),0 0 0 1px var(--line);
  --blue:#0A66C2;--blue-strong:#004182;--blue-tint:#E8F1FB;--on-blue:#FFFFFF;
  --green:#057642;--green-tint:#E3F1E8;--amber:#915907;--amber-tint:#FBF0D6;
  --red:#B3261E;--red-tint:#FCE8E9;--purple:#7A3EB1;--purple-tint:#F2EAFA;
  --teal:#0E7C86;--teal-tint:#E2F3F4;--grey:#7A7874;--grey-tint:#ECEBE8;--today-tint:#F5F9FD;
  --shadow-lg:0 12px 40px rgba(0,0,0,.18);
  --av1:#3F6FA8;--av2:#8C5A3C;--av3:#2E7D6B;--av4:#7A4E9C;--av5:#A0662A;--av6:#5B6B8C;
  --font:"Inter",-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,p,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
svg{flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}.xs{font-size:12px}.sm{font-size:13px}
.eyebrow{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--card)}
.topbar{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1352px;margin:0 auto;height:52px;display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.wordmark{font-weight:700;font-size:19px;color:var(--blue);letter-spacing:-.01em}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
@media (max-width:620px){.sync span{display:none}}

/* shell */
.shell{flex:1;min-height:0;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:344px minmax(0,1fr) 296px;background:var(--card);border-radius:8px;box-shadow:0 0 0 1px var(--line);overflow:hidden;position:relative}
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.thread{display:flex;flex-direction:column;min-height:0;min-width:0}
.panel{border-left:1px solid var(--line);overflow-y:auto;min-height:0}

/* primitives */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none;line-height:1;position:relative}
.av.me{background:var(--blue)!important;color:var(--on-blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;font-weight:600;font-size:14px;padding:5px 16px;min-height:32px;white-space:nowrap;transition:background .15s,box-shadow .15s,color .15s}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--blue);color:var(--on-blue)}.btn.pri:hover{background:var(--blue-strong)}
.btn.sec{box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue)}.btn.sec:hover{background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--blue)}
.btn.ghost{color:var(--muted)}.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{font-size:13px;padding:3px 12px;min-height:28px}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--fg)}.icon-btn svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--hover);color:var(--muted)}
.pill svg{width:12px;height:12px}
.pill.warn{background:var(--amber-tint);color:var(--amber)}
.pill.bad{background:var(--red-tint);color:var(--red)}
.pill.tie{background:var(--blue-tint);color:var(--blue)}
.pill.cal{background:var(--purple-tint);color:var(--purple)}
.ta,.sel{width:100%;background:var(--card);border:1px solid var(--line-strong);border-radius:6px;color:var(--fg)}
.ta{padding:10px 12px;resize:none;line-height:1.5}
.sel{padding:5px 8px;cursor:pointer}
.ta:focus,.sel:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}

/* list */
.list-h{padding:12px 14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.lsearch{display:flex;align-items:center;gap:8px;background:var(--search);border-radius:4px;height:32px;padding:0 10px;color:var(--muted)}
.lsearch svg{width:16px;height:16px}
.lsearch input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--fg)}
.lsearch:focus-within{box-shadow:0 0 0 2px var(--blue)}
.tabs{display:flex;gap:4px}
.tab{padding:8px 10px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--green);border-bottom-color:var(--green)}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums;background:var(--hover);border-radius:999px;padding:0 7px}
.tab.on .n{background:var(--green-tint)}
.cofilter{margin-left:auto;align-self:center;width:auto;font-size:13px;padding:3px 6px}
.list-body{flex:1;overflow-y:auto;min-height:0}
.grp{padding:12px 14px 6px;background:var(--soft);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 14px 12px 11px;border-left:3px solid transparent;border-bottom:1px solid var(--line);width:100%}
.row:hover{background:var(--hover)}
.row.on{background:var(--blue-tint);border-left-color:var(--green)}
.row-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-pre{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .row-pre{color:var(--fg);font-weight:600}
.udot{position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--card)}
.draft-w{color:var(--red);font-weight:600}
.list-empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.list-empty svg{width:28px;height:28px;color:var(--green)}

/* thread */
.th-h{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.th-who{flex:1;min-width:0;display:flex;flex-direction:column}
.th-who b{font-size:15px}
.th-who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-actions{display:flex;gap:4px;align-items:center}
.back-btn,.panel-btn{display:none}
.banner{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);font-size:13px}
.banner svg{width:18px;height:18px}
.banner p{flex:1;min-width:0}
.banner.cal{background:var(--purple-tint)}.banner.cal svg{color:var(--purple)}
.banner.wait{background:var(--soft)}.banner.wait svg{color:var(--muted)}
.tbody{flex:1;min-height:96px;overflow-y:auto;padding:4px 20px 14px;display:flex;flex-direction:column}
.dsep{display:flex;align-items:center;gap:12px;margin:14px 0 4px;font-size:12px;font-weight:600;color:var(--muted)}
.dsep::before,.dsep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding-top:10px}
.msg.cont{padding-top:2px}
.msg-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg-h b{font-weight:600}
.msg-t{white-space:pre-line;overflow-wrap:anywhere}
.ev{display:flex;align-items:center;gap:8px;padding:8px 0 0 46px;font-size:12px;color:var(--muted)}
.ev svg{width:14px;height:14px;color:var(--subtle)}
.empty-th{margin:auto;max-width:400px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:24px 0}

/* composer */
.composer{border-top:1px solid var(--line);padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.sugg-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue)}
.sugg-h svg{width:14px;height:14px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sopt{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);white-space:nowrap}
.sopt:hover{background:var(--blue-tint)}
.sopt.on{background:var(--blue);color:var(--on-blue)}
.why{display:flex;gap:6px;font-size:12px;color:var(--muted);align-items:flex-start}
.why svg{width:14px;height:14px;margin-top:1px;color:var(--subtle)}
#c-text{min-height:64px;max-height:clamp(64px,calc(100vh - 480px),200px);overflow-y:auto}
.adjust{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.adjust button{padding:2px 10px;border-radius:999px;font-weight:600;box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--fg)}
.adjust button:hover{background:var(--hover)}
.adjust .wc{margin-left:auto;font-variant-numeric:tabular-nums}
.adjust .over{color:var(--amber);font-weight:600}
.comp-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fu{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-right:auto}
.fu svg{width:16px;height:16px;color:var(--blue)}
.fu .sel{width:auto;padding:3px 6px;font-size:13px}

/* panel */
.p-head{padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;border-bottom:1px solid var(--line)}
.p-head h2{font-size:17px;font-weight:600;margin-top:8px}
.p-back{display:none}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:13px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.steps::before{content:"";position:absolute;left:12.5%;right:12.5%;top:9px;height:2px;background:var(--line)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:0 2px}
.step i{width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line-strong);display:grid;place-items:center;color:var(--on-blue)}
.step i svg{width:12px;height:12px}
.step.done i{background:var(--green);box-shadow:none}
.step.cur i{background:var(--card);box-shadow:inset 0 0 0 6px var(--green)}
.step.done,.step.cur{color:var(--fg)}
.step:hover i{box-shadow:inset 0 0 0 2px var(--green)}
.step.done:hover i{box-shadow:none}
.kv{display:flex;flex-direction:column;gap:3px}
.kv dt{font-size:12px;color:var(--muted);font-weight:600}
.note{padding:10px 12px;border-radius:6px;background:var(--amber-tint);font-size:13px;display:flex;flex-direction:column;gap:4px}
.note .xs{color:var(--amber);font-weight:600}
.assoc button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:8px;align-items:center;width:100%;padding:4px 0;text-align:left}
.assoc button:hover .an{color:var(--blue);text-decoration:underline}
.assoc .an{font-weight:600;font-size:13px;display:block}

/* responsive */
@media (max-width:1180px){
  .app{grid-template-columns:320px minmax(0,1fr)}
  .panel{position:absolute;top:0;right:0;bottom:0;width:min(320px,100%);background:var(--card);box-shadow:var(--shadow-lg);z-index:5;display:none}
  .app.panel-open .panel{display:block}
  .panel-btn{display:grid}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .list,.thread{display:none}
  .app[data-pane="list"] .list,.app[data-pane="thread"] .thread{display:flex}
  .app[data-pane="panel"] .panel{display:block;position:static;width:auto;box-shadow:none;border-left:0}
  .back-btn{display:grid}
  .p-back{display:flex;padding:10px 12px 0}
  .th-actions .lbl{display:none}
}

/* mode switch */
.modes{display:flex;gap:2px;margin-left:20px;background:var(--soft);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.modes a{display:flex;align-items:center;gap:6px;padding:4px 14px;border-radius:999px;font-weight:600;color:var(--muted);text-decoration:none;font-size:13px}
.modes a svg{width:16px;height:16px}
.modes a:hover{color:var(--fg)}
.modes a.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.modes .n{font-size:11px;background:var(--red);color:var(--on-blue);border-radius:999px;padding:0 6px;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:560px){.modes{margin-left:4px}.modes .ml{display:none}.modes a{padding:4px 10px}}
.pill.send{background:var(--teal-tint);color:var(--teal)}
.banner.send{background:var(--teal-tint)}.banner.send svg{color:var(--teal)}
.pop-h{padding:6px 10px 2px}
.pop-note{display:flex;gap:6px;padding:8px 10px 4px;margin-top:4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);max-width:290px}
.pop-note svg{width:14px;height:14px;margin-top:1px;color:var(--teal)}

/* calendar */
.k-reply{--k:var(--blue);--kt:var(--blue-tint)}
.k-follow{--k:var(--amber);--kt:var(--amber-tint)}
.k-send{--k:var(--teal);--kt:var(--teal-tint)}
.k-chat{--k:var(--purple);--kt:var(--purple-tint)}
.k-deadline{--k:var(--red);--kt:var(--red-tint)}
.k-busy{--k:var(--grey);--kt:var(--grey-tint)}
.calapp{height:100%;max-width:1320px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--card);border-radius:8px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.cside{border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;background:var(--soft);min-height:0}
.mini-h{font-weight:600;font-size:13px;padding:0 4px}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;margin-top:6px}
.mini .dw{font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
.mini button{height:26px;border-radius:50%;font-size:12px;position:relative;font-variant-numeric:tabular-nums;text-align:center}
.mini button:hover{background:var(--hover)}
.mini button.out{color:var(--subtle)}
.mini button.inwk{background:var(--blue-tint);border-radius:4px}
.mini button.today{background:var(--blue);color:var(--on-blue);font-weight:700;border-radius:50%}
.mini button.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--amber)}
.mini button.today.has::after{background:var(--on-blue)}
.wsum{display:flex;flex-direction:column;gap:6px}
.wsum p{font-size:13px}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.cat input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 2px var(--k);margin:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--card)}
.cat input:checked{background:var(--k)}
.cat input:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--card);border-bottom:2px solid var(--card);transform:translateY(-1px) rotate(-45deg)}
.cat .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tip{font-size:12px;color:var(--muted);display:flex;gap:6px}
.tip svg{width:14px;height:14px;margin-top:1px}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.ctool{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctool h1{font-size:18px;font-weight:600;margin-left:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;margin-left:auto;box-shadow:inset 0 0 0 1px var(--line-strong);border-radius:999px;padding:2px}
.seg button{padding:3px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--blue-tint);color:var(--blue-strong)}
.cbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.wk{min-width:760px;display:flex;flex-direction:column}
.wk-top{position:sticky;top:0;z-index:6;background:var(--card)}
.wk-h,.wk-ad,.wk-grid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.wk-h{border-bottom:1px solid var(--line)}
.wk-h>div{padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk-h .dw{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wk-h .dn{font-size:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.wk-h .today .dw{color:var(--blue)}
.wk-h .today .dn{background:var(--blue);color:var(--on-blue)}
.wk-h .past .dn{color:var(--muted)}
.wk-ad{border-bottom:1px solid var(--line-strong)}
.wk-ad .lbl{font-size:10px;color:var(--muted);text-align:right;padding:6px 8px 0 0}
.adcell{border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:44px;max-height:128px;overflow-y:auto;min-width:0}
.adcell.over,.mcell.over,.dcol.over{background:var(--blue-tint)}
.hrs{display:flex;flex-direction:column}
.hr{height:48px;font-size:10px;color:var(--muted);text-align:right;padding-right:8px;position:relative;top:-7px}
.dcol{position:relative;border-left:1px solid var(--line);height:624px;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 48px)}
.dcol.today{background-color:var(--today-tint)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}

  if(k==="follow"){const n=TODAY-c.fu;return `<span class="pill ${n?"bad":"warn"}">${I.bell} Follow up${n?` · ${n}d late`:""}</span>`;}
  if(k==="thanks")return `<span class="pill warn">${I.reply} Thank-you</span>`;
  if(k==="chat")return `<span class="pill cal">${I.cal} ${c.mt.t}</span>`;
  if(k==="first")return `<span class="pill tie">${I.pen} First note</span>`;
  if(snoozed(c))return `<span class="pill">${I.moon} ${fmt(c.snz)}</span>`;
  if(c.mt&&c.mt.d>TODAY)return `<span class="pill cal">${I.cal} ${fmtD(c.mt.d).split(", ")[0]} ${c.mt.t}</span>`;
  if(c.via&&!msgs(c).length)return `<span class="pill">Intro pending</span>`;
  if(c.fu!=null&&c.fu>TODAY)return `<span class="pill">${I.bell} ${fmt(c.fu)}</span>`;

}
const mins=t=>{const m=/(\d+):(\d+) (AM|PM)/.exec(t||"");if(!m)return 1439;let h=+m[1]%12;if(m[3]==="PM")h+=12;return h*60+ +m[2];};
const lastKey=c=>{const m=lastMsg(c);return m?m[2]*1440+mins(m[3]):-1e9;};
const nextKey=c=>Math.min(c.sched?c.sched.d:9e3,snoozed(c)?c.snz:9e3,c.mt?c.mt.d:9e3,c.fu!=null?c.fu:9e3,c.via?TODAY+5:9e3);
function rows(){
  const q=state.q.toLowerCase().trim();
  let ids=Object.keys(C).filter(k=>{const c=C[k];
    if(state.tab==="todo"&&!isTodo(c))return false;
    if(state.tab==="waiting"&&!isWaiting(c))return false;
    if(state.tab==="all"&&state.co!=="all"&&c.co!==state.co)return false;
    return !q||[c.n,c.t,c.team,CO[c.co]].join(" ").toLowerCase().includes(q);});
  const order=["reply","follow","thanks","chat","first"];
  if(state.tab==="todo")ids.sort((a,b)=>order.indexOf(todoKind(C[a]))-order.indexOf(todoKind(C[b]))||lastKey(C[a])-lastKey(C[b]));
  else if(state.tab==="waiting")ids.sort((a,b)=>nextKey(C[a])-nextKey(C[b]));
  else ids.sort((a,b)=>lastKey(C[b])-lastKey(C[a]));
  return ids;
}
function sugFor(id){
  const c=C[id],k=todoKind(c);
  if(k==="reply"||k==="follow"||k==="first"){if(SUG[id])return SUG[id];return genericSug(id,"nudge");}
  if(k==="thanks")return genericSug(id,"thanks");
  if(state.force[id])return SUG[id]&&SUG[id][0]==="nudge"?SUG[id]:genericSug(id,"nudge");
  return null;
}

  const cols=days.map(d=>{

    let cl=[],clEnd=-1;const flush=()=>{const lanes=[];cl.forEach(i=>{const e=E[i];let L=lanes.findIndex(end=>end<=e.start);if(L<0){L=lanes.length;lanes.push(0);}lanes[L]=e.start+Math.max(e.dur,30);pos[i]=[L,0];});cl.forEach(i=>{pos[i][1]=lanes.length;});cl=[];};
    ts.forEach(i=>{const e=E[i];if(cl.length&&e.start>=clEnd)flush();cl.push(i);clEnd=Math.max(clEnd,e.start+Math.max(e.dur,30));});flush();

function monthHTML(){

    case "unsnooze":c.snz=null;if(c.fu===37)c.fu=TODAY;toast(`${first(id)} is back in To do`);renderAll(true);break;
    case "snooze-pop":openPop(el,[[26,"Tomorrow","Thu, Nov 26"],[30,"Monday morning","Mon, Nov 30"],[32,"Next week","Wed, Dec 2"]].map(([d,l,s])=>`<button class="pi" data-act="snooze" data-arg="${d}"><b>${l}</b><span>${s}</span></button>`).join(""));break;
    case "snooze":{const d=+g;closePop();c.snz=d;c.fu=d;addEvent(id,`Snoozed until ${fmtD(d)}`,"moon");toast(`Snoozed. ${first(id)} comes back ${fmtD(d)}.`);renderAll(true);break;}
    case "done":c.done=true;c.acted="Marked done:";c.thx=false;c.firstNote=false;if(fuDue(c))c.fu=null;toast(`Done. ${first(id)} comes back if they write again.`);renderAll();break;
    case "log-chat":
      addEvent(id,"Coffee chat · 30 min","chat");PAST.push({id,d:TODAY,t:c.mt&&c.mt.d===TODAY?c.mt.t:"11:00 AM",dur:30});c.mt=null;c.step=Math.max(c.step,2);c.thx=true;c.done=true;
      c.draft="";delete state.pick[id];
      toast("Nice. Thank-you suggestions are ready, and you can add notes on the right.");
      if(!narrow()&&matchMedia("(max-width:1180px)").matches)state.panel=true;
      renderAll(true);break;
    case "step":{const i=+g;c.step=i;toast(`${first(id)}: ${STEPS[i]}`);renderPanel();break;}
    case "save-note":{const t=$("#note-new"),v=t.value.trim();if(!v){toast("Write a note first");t.focus();break;}c.notes.push({d:TODAY,text:v});addEvent(id,"Note added","note");state.noteDraft="";toast("Note saved");renderAll(true);break;}
    case "send":send();break;
    case "sched-pop":openPop(el,`<p class="pop-h eyebrow">Send later</p>`+SCHED.map(([d,t,l,n])=>`<button class="pi" data-act="schedule" data-arg="${d}|${t}"><b>${l}</b>${n?`<span>${n}</span>`:""}</button>`).join("")+`<p class="pop-note">${I.info}<span>If ${first(id)} replies before then, this message won't send. It moves back to your drafts so you can update it.</span></p>`);break;
    case "schedule":{const[d,t]=g.split("|");closePop();schedule(+d,t);break;}
    case "sendnow":closePop();sendNow(g);break;
    case "sched-edit":{c.draft=c.sched.text;delete c.sched;c.done=false;toast("Moved back to your draft. Nothing was sent.");renderAll(true);break;}
    case "cal-today":state.wk=TODAY-dowI(TODAY);state.mon=monthOf(TODAY);renderCal(true);break;
    case "cal-nav":{const n=+g;if(state.cview==="week")state.wk=Math.max(-6,Math.min(85,state.wk+7*n));else state.mon=Math.max(0,Math.min(2,state.mon+n));renderCal(true);break;}
    case "cview":if(g==="month")state.mon=monthOf(Math.max(1,state.wk+3));else{const d=state.mon===monthOf(TODAY)?TODAY:MONTHS[state.mon].first;state.wk=d-dowI(d);}state.cview=g;renderCal(true);break;
    case "goweek":{const d=+g;closePop();state.cview="week";state.wk=d-dowI(d);renderCal(true);break;}
    case "ev":openPop(el,evPop(+g));break;
    case "daypop":{const d=+g,E=state.evs;openPop(el,`<div class="daylist"><p class="eyebrow">${fmtD(d)}</p>${E.map((_,i)=>i).filter(i=>E[i].d===d&&E[i].start==null).sort((a,b)=>CORD[E[a].cat]-CORD[E[b].cat]).map(chip).join("")}</div>`);break;}
    case "move":{const[i,d]=g.split("|").map(Number);closePop();moveEv(state.evs[i],d);break;}
    case "goto":closePop();gotoConv(g);break;
    case "goto-pick":{const[k,i]=g.split("|");const sg=sugFor(k);if(sg&&sg[1][+i]){C[k].draft=sg[1][+i][1];state.pick[k]=+i;}closePop();gotoConv(k);break;}
    case "go-cal":{const d=+g||TODAY;closePop();state.cview="week";state.wk=d-dowI(d);location.hash="calendar";break;}
    case "co-inbox":{const cs=Object.keys(C).filter(k=>C[k].co===g&&!C[k].cls);state.tab="all";state.co=g;state.q="";const q=$("#l-q");if(q)q.value="";if(cs[0])state.sel=cs[0];location.hash="inbox";break;}
    case "cal-done":{const c2=C[g];closePop();c2.fu=null;c2.done=true;toast(`Reminder for ${first(g)} removed`);renderCal();break;}
  }
}

/* ---------- boot ---------- */
function boot(){
  $("#me-av").innerHTML=av("me",30);
  renderListHead();
  document.addEventListener("click",e=>{
    const pop=$("#pop"),t=e.target.closest("[data-act]");
    if(!pop.hidden&&!pop.contains(e.target)){const same=state.popFor&&state.popFor.contains(e.target);closePop();if(same)return;}
    if(t)handle(t.dataset.act,t.dataset.arg||"",t);
  });
  document.addEventListener("input",e=>{
    const id=e.target.id;
    if(id==="c-text"){const had=!!C[state.sel].draft.trim();C[state.sel].draft=e.target.value;adjustBar();sizeTA();if(had!==!!e.target.value.trim())renderList();}
    else if(id==="note-new")state.noteDraft=e.target.value;
    else if(id==="l-q"){state.q=e.target.value;renderList();}
  });
  document.addEventListener("change",e=>{
    const el=e.target,id=state.sel,c=C[id];
    if(el.id==="co-sel"){state.co=el.value;renderList();}
    else if(el.id==="fu-sel")state.fuSet[id]=+el.value;
    else if(el.matches("[data-cat]")){state.cats[el.dataset.cat]=el.checked?1:0;renderCal();}
    else if(el.id==="fu-rec"){c.fu=el.value?+el.value:null;toast(c.fu?`Reminder set for ${fmtD(c.fu)}`:"Reminder removed");renderAll();}
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){closePop();if(state.panel){state.panel=false;renderAll();}return;}
    if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&e.target.id==="c-text"){e.preventDefault();send();return;}
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
    if(state.mode!=="inbox")return;
    if(e.key==="j"||e.key==="k"){const ids=rows();if(!ids.length)return;let i=ids.indexOf(state.sel);i=i<0?0:Math.max(0,Math.min(ids.length-1,i+(e.key==="j"?1:-1)));open(ids[i]);const r=document.querySelector(".row.on");if(r)r.scrollIntoView({block:"nearest"});}
  });
  addEventListener("resize",()=>{if(!$("#pop").hidden)closePop();});
  const zone=t=>t&&t.closest?t.closest("[data-day]"):null;
  document.addEventListener("dragstart",e=>{const t=e.target.closest&&e.target.closest('[data-act="ev"][draggable="true"]');if(!t)return;e.dataTransfer.setData("text/plain",t.dataset.arg);e.dataTransfer.effectAllowed="move";closePop();});
  document.addEventListener("dragover",e=>{const z=zone(e.target);if(!z)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>{if(x!==z)x.classList.remove("over");});z.classList.add("over");});
  document.addEventListener("dragleave",e=>{const z=zone(e.target);if(z&&!z.contains(e.relatedTarget))z.classList.remove("over");});
  document.addEventListener("drop",e=>{const z=zone(e.target);if(!z)return;e.preventDefault();z.classList.remove("over");const raw=e.dataTransfer.getData("text/plain");if(raw==="")return;moveEv(state.evs[+raw],+z.dataset.day);});
  document.addEventListener("dragend",()=>document.querySelectorAll(".over").forEach(x=>x.classList.remove("over")));
  addEventListener("hashchange",route);
  route();
}
if(typeof document!=="undefined"&&document.getElementById("app"))boot();
</script>
